# v로 시작하는 태그(예: v0.1.0)를 푸시하면 서명된 APK를 빌드해 GitHub Release에 올린다.
# APK는 CPU별로 하나씩 올라가고, Obtainium은 기기에 맞는 것을 골라 설치·업데이트한다.
#
# 저장소 Secrets에 필요한 값:
#   KEYSTORE_BASE64    서명 키 저장소(.jks)를 base64로 인코딩한 문자열
#   KEYSTORE_PASSWORD  키 저장소 비밀번호
#   KEY_ALIAS          키 별칭
#   KEY_PASSWORD       키 비밀번호
name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - uses: gradle/actions/setup-gradle@v4

      - name: Check signing secrets
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "::error::KEYSTORE_BASE64 secret is missing. A release must be signed with the same key every time."
            exit 1
          fi
          echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.jks"

      - name: Test and build
        env:
          MOCHI_KEYSTORE: ${{ runner.temp }}/release.jks
          MOCHI_KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          MOCHI_KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          MOCHI_KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
          MOCHI_REQUIRE_SIGNING: "1"
        run: ./gradlew :core:test :app:assembleRelease

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          mkdir dist
          for abi in arm64-v8a armeabi-v7a x86_64 x86; do
            cp "app/build/outputs/apk/release/app-$abi-release.apk" "dist/mochikeys-$TAG-$abi.apk"
          done
          (cd dist && sha256sum *.apk > SHA256SUMS.txt)
          gh release create "$TAG" dist/* --title "Mochi Keys $TAG" --generate-notes
